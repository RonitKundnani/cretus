# Required repository secrets: SUPABASE_URL (https://<project-ref>.supabase.co)
# and SUPABASE_ANON_KEY (publishable key or legacy anon key).
# Optional SUPABASE_MANAGEMENT_TOKEN: a separate Supabase access token scoped
# to this project with project_admin_read and project_admin_write. If enabled,
# the workflow can resume an inactive project, including one paused manually.

name: Supabase keepalive

on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/supabase-keepalive.yml]

permissions:
  actions: write

concurrency:
  group: supabase-keepalive

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Supabase and recover from a pause
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          project_url=${SUPABASE_URL%/}
          if [[ ! "$project_url" =~ ^https://([a-z0-9]{20})\.supabase\.co$ ]]; then
            fail "Set SUPABASE_URL to the standard Supabase project URL (https://<project-ref>.supabase.co)."
          fi
          project_ref=${BASH_REMATCH[1]}
          [[ -n "$SUPABASE_ANON_KEY" ]] || fail "Set the SUPABASE_ANON_KEY repository secret."

          request=(curl --silent --show-error --connect-timeout 5 --max-time 15)
          headers=(--header "apikey: $SUPABASE_ANON_KEY")
          if [[ "$SUPABASE_ANON_KEY" == eyJ* ]]; then
            headers+=(--header "Authorization: Bearer $SUPABASE_ANON_KEY")
          fi

          probe() {
            curl_exit=0
            if http_status=$("${request[@]}" "$@" --output /dev/null --write-out '%{http_code}' \
              "${headers[@]}" "$project_url/rest/v1/committee_members?select=id&limit=1"); then
              echo "Supabase Data API returned HTTP $http_status."
              [[ "$http_status" == 200 ]]
            else
              curl_exit=$?
              echo "Supabase Data API request failed with curl exit code $curl_exit."
              return 1
            fi
          }

          if probe --retry 2 --retry-delay 3 --retry-max-time 35; then
            exit 0
          fi

          if [[ "$curl_exit" != 6 && "$http_status" != 540 && "$http_status" != 521 ]]; then
            fail "Database check failed (HTTP $http_status, curl exit $curl_exit). Verify the project key and table access."
          fi

          if [[ -z "$SUPABASE_MANAGEMENT_TOKEN" ]]; then
            fail "The Supabase Data API is unavailable. Check the URL and resume a paused project at https://supabase.com/dashboard/project/$project_ref, or set SUPABASE_MANAGEMENT_TOKEN for automatic recovery."
          fi

          management=("${request[@]}" --fail --header "Authorization: Bearer $SUPABASE_MANAGEMENT_TOKEN")
          project_api="https://api.supabase.com/v1/projects/$project_ref"

          if ! project_status=$("${management[@]}" "$project_api" | jq -er '.status | select(test("^[A-Z_]+$"))'); then
            fail "Could not check project status. Verify the project URL and token's project_admin_read permission."
          fi

          case "$project_status" in
            INACTIVE)
              echo "Supabase reports the project is inactive. Requesting a restore."
              if ! "${management[@]}" --request POST --output /dev/null "$project_api/restore"; then
                fail "Restore request failed. Check the token's project_admin_write permission, available project slots, and the Supabase dashboard."
              fi
              echo "Supabase accepted the restore request. Waiting for the Data API."
              ;;
            RESTORING|COMING_UP)
              echo "Supabase reports the project is $project_status. Waiting for the Data API."
              ;;
            *)
              fail "Supabase reports $project_status. Check the Supabase dashboard and Data API hostname."
              ;;
          esac

          # The gateway can return 404 or 521 before the restored API is ready.
          for attempt in {1..18}; do
            sleep 20
            if probe; then
              echo "The Supabase database is reachable again."
              exit 0
            fi
            case "$http_status" in
              401|403)
                fail "The Data API returned HTTP $http_status. Verify the project key and table access."
                ;;
            esac
          done

          fail "The database is still unreachable after waiting for a restore (HTTP $http_status, curl exit $curl_exit). Check the Supabase dashboard."

      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/enable"
